kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: fraudstream-platform
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30500
        hostPort: 30500
        protocol: TCP
      - containerPort: 30800
        hostPort: 30800
        protocol: TCP
    extraMounts:
      - hostPath: ./data
        containerPath: /mnt/data
      - hostPath: ./mlruns
        containerPath: /mnt/mlruns
      - hostPath: ./airflow/dags
        containerPath: /mnt/dags
      - hostPath: ./models
        containerPath: /mnt/models
