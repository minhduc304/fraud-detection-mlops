apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  namespace: fraudstream
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-pod-launcher
  namespace: fraudstream
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete", "patch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-pod-launcher
  namespace: fraudstream
subjects:
  - kind: ServiceAccount
    name: airflow
    namespace: fraudstream
roleRef:
  kind: Role
  name: airflow-pod-launcher
  apiGroup: rbac.authorization.k8s.io
